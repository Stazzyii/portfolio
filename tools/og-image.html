<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG image template</title>
<!-- Rendered to assets/img/og-image.png (1200×630) by tools/capture_screenshots.py -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { background: #07080b; color: #eceef4; font-family: Inter, sans-serif; position: relative; overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 56px 56px; }
  .glow { position: absolute; width: 800px; height: 600px; right: -200px; top: -200px; background: radial-gradient(closest-side, rgba(91,140,255,.3), transparent 70%); }
  .glow2 { position: absolute; width: 600px; height: 500px; right: 80px; bottom: -260px; background: radial-gradient(closest-side, rgba(155,123,255,.25), transparent 70%); }
  .wrap { position: absolute; inset: 0; padding: 72px 80px; display: grid; grid-template-columns: 1fr 300px; gap: 56px; align-items: center; }
  .mono { font-family: "JetBrains Mono", monospace; color: #8fb0ff; font-size: 20px; letter-spacing: .06em; }
  h1 { font-family: "Space Grotesk", sans-serif; font-size: 68px; line-height: 1.02; letter-spacing: -0.035em; margin: 22px 0 0; font-weight: 700; }
  h1 span { background: linear-gradient(100deg, #8fb0ff, #b9a3ff 60%, #e6dcff); -webkit-background-clip: text; color: transparent; }
  .roles { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
  .roles b { font-weight: 500; font-size: 19px; color: #c5ccdb; border: 1px solid rgba(255,255,255,.14); padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,.03); }
  .photo { width: 300px; height: 360px; border-radius: 26px; overflow: hidden; border: 1px solid rgba(255,255,255,.14); box-shadow: 0 30px 60px -20px #000; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div><div class="glow2"></div>
  <div class="wrap">
    <div>
      <div class="mono">EMEDIONG NDONG ODIONG</div>
      <h1>Building digital experiences that <span>help businesses grow.</span></h1>
      <div class="roles"><b>Full-Stack Web Developer</b><b>Data Entry</b><b>IT Support</b></div>
    </div>
    <div class="photo"><img src="../assets/img/profile.webp" alt="" /></div>
  </div>
</body>
</html>
